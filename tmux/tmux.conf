set  -g default-shell "/usr/bin/zsh"

set -g status-keys vi
set -g mode-keys   vi

unbind C-b
set -g prefix C-a

set  -g mouse             on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -g history-limit     2000

set-option -g status-position top
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded."

set-window-option -g main-pane-width 70%
set-hook -g window-linked "select-layout main-vertical"

# set -gq allow-passthrough off
set -g escape-time 10
set -g visual-activity off
setw -g aggressive-resize off
setw -g clock-mode-style 12

bind c copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key b set-option status
bind % split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind-key P select-layout main-vertical

set-option -g @mauve "#cba6f7"
set-option -g @green "#a6e3a1"
set-option -g @red "#f38ba8"
set-option -g @blue "#89b4fa"
set-option -g @text "#cdd6f4"
set-option -g @crust "#11111b"
set-option -g @surface0 "#313244"

set-option -g pane-active-border "fg=#{@mauve}"
set-option -g pane-border-style "fg=#{@surface0}"
set-option -g status-style "bg=default fg=#{@text}"

set-option -g status-left-style none
set -g status-left-length 60
set-option -g status-left "#[fg=#{@mauve}] Session:#[fg=#{@text}] #S #[fg=#{@mauve}]Window:#[fg=#{@text}] #I#[fg=#{@mauve}]:#[fg=#{@text}]#W #{?#{==:#{client_key_table},prefix}, #[fg=#{@red}],#[fg=#{@blue}] } "

set-option -g status-right-style none
set -g status-right-length 120
set -g status-right '#[fg=#{@mauve}]#(if git -C "#{pane_current_path}" rev-parse --is-inside-work-tree 2>/dev/null; then echo "Branch: #[fg=#{@text}]$(git -C "#{pane_current_path}" rev-parse --abbrev-ref HEAD)"; fi) #[fg=#{@mauve}] Shell: #[fg=#{@text}]#(echo $SHELL) #[fg=#{@mauve}] Path: #[fg=#{@text}]#{p:pane_current_path} #[fg=#{@mauve}] Time: #[fg=#{@text}]%H:#[fg=#{@text}]%M '

# Overrides default tmux window name and id
set -g window-status-separator ""
set -g window-status-current-format ""
set -g window-status-format ""
